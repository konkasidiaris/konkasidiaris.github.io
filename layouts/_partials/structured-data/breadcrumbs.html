{{- if .IsHome -}}
  {{- errorf "BreadcrumbList schema: cannot be used on homepage" -}}
{{- end -}}

{{- $baseURL := .Site.BaseURL -}}
{{- if not $baseURL -}}
  {{- errorf "BreadcrumbList schema: .Site.BaseURL is required" -}}
{{- end -}}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ $baseURL }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ title .Section }}",
      "item": "{{ .Permalink }}"
    }
    {{- if not .IsSection -}}
    ,
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ .LinkTitle }}",
      "item": "{{ .Permalink }}"
    }
    {{- end }}
  ]
}
</script>
